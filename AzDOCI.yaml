name: $(Date:yy).$(DayOfYear)
trigger:
  branches:
    include:
      - main

pool:
  vmImage: windows-latest

steps:
  - checkout: self

  - powershell: |
      $now = Get-Date
      $secondsOfDay = [int][Math]::Floor($now.TimeOfDay.TotalSeconds)
      $buildNumber = '{0}.{1}.{2}' -f $now.ToString('yy'), $now.DayOfYear, $secondsOfDay
      Write-Host "##vso[build.updatebuildnumber]$buildNumber"
    displayName: Set build number (YY.DayOfYear.SecondsSinceDayStart)

  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'

  - script: npm ci
    displayName: Install dependencies

  - script: npm install --no-save eslint@9 @typescript-eslint/parser @typescript-eslint/eslint-plugin stylelint stylelint-config-standard
    displayName: Install lint tooling

  - powershell: |
      @'
      // Flat config for ESLint v9+
      import tseslint from "@typescript-eslint/eslint-plugin";
      import tsParser from "@typescript-eslint/parser";

      export default [
        {
          files: ["src/**/*.{ts,tsx}"],
          languageOptions: {
            parser: tsParser,
            parserOptions: {
              ecmaVersion: "latest",
              sourceType: "module",
              project: "./tsconfig.json"
            }
          },
          plugins: { "@typescript-eslint": tseslint },
          rules: {
            "no-unused-vars": "off",
            "@typescript-eslint/no-unused-vars": ["error", { "argsIgnorePattern": "^_", "varsIgnorePattern": "^_" }]
          }
        }
      ];
      '@ | Set-Content -Path eslint.config.mjs -Encoding UTF8
    displayName: Create ESLint flat config

  - script: npx eslint "src/**/*.{ts,tsx}" --max-warnings=0
    displayName: Lint TS/TSX



  - script: npm run build
    displayName: Build

  - powershell: |
      New-Item -ItemType Directory -Path "$(Build.ArtifactStagingDirectory)\site" -Force | Out-Null
      Copy-Item -Path "dist\*" -Destination "$(Build.ArtifactStagingDirectory)\site" -Recurse
      Compress-Archive -Path "$(Build.ArtifactStagingDirectory)\site\*" -DestinationPath "$(Build.ArtifactStagingDirectory)\oneluckidev-site-$(Build.BuildNumber).zip" -Force
    displayName: Package for IIS (ZIP)

  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: '$(Build.ArtifactStagingDirectory)'
      artifactName: 'drop'
    displayName: Publish artifact