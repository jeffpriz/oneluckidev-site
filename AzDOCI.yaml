name: $(Date:yy).$(DayOfYear).$(Seconds)

trigger:
  branches:
    include:
      - main

pool:
  vmImage: windows-latest

steps:
  - checkout: self

  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'

  - script: npm ci
    displayName: Install dependencies

  - script: npm install --save-dev eslint@9 @eslint/js typescript-eslint stylelint stylelint-config-standard
    displayName: Install lint tooling

  - script: >
      node -e "
      const fs = require('fs');
      const config = `
      import js from '@eslint/js';
      import tseslint from 'typescript-eslint';
      export default [
        js.configs.recommended,
        ...tseslint.configs.recommended,
        {
          files: ['src/**/*.{ts,tsx}'],
          languageOptions: {
            parserOptions: {
              ecmaFeatures: { jsx: true }
            }
          }
        },
        { ignores: ['dist/**', 'node_modules/**'] }
      ];
      `;
      fs.writeFileSync('eslint.config.mjs', config.trim());
      "
    displayName: Generate ESLint flat config

  - script: npx --no eslint "src/**/*.{ts,tsx}" --max-warnings=0
    displayName: Lint TS/TSX

  - script: >
      node -e "
      const fs = require('fs');
      const config = JSON.stringify({
        extends: ['stylelint-config-standard'],
        rules: { 'color-no-invalid-hex': true }
      }, null, 2);
      fs.writeFileSync('.stylelintrc.json', config);
      "
    displayName: Generate Stylelint config

  - script: npx --no stylelint "src/**/*.css"
    displayName: Lint CSS

  - script: npm run build
    displayName: Build

  - powershell: |
      New-Item -ItemType Directory -Path "$(Build.ArtifactStagingDirectory)\site" -Force | Out-Null
      Copy-Item -Path "dist\*" -Destination "$(Build.ArtifactStagingDirectory)\site" -Recurse
      Compress-Archive -Path "$(Build.ArtifactStagingDirectory)\site\*" `
        -DestinationPath "$(Build.ArtifactStagingDirectory)\oneluckidev-site-$(Build.BuildNumber).zip" -Force
    displayName: Package for IIS (ZIP)

  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: '$(Build.ArtifactStagingDirectory)'
      artifactName: 'drop'
    displayName: Publish artifact