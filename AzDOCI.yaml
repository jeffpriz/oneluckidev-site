name: $(Date:yy).$(DayOfYear).$(Seconds)

trigger:
  branches:
    include:
      - main

pool:
  vmImage: windows-latest

steps:
  - checkout: self

  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'

  - script: npm ci
    displayName: Install dependencies

  - script: npm install --save-dev eslint@9 @eslint/js typescript-eslint stylelint stylelint-config-standard
    displayName: Install lint tooling

  - script: node -e "var fs=require('fs');fs.writeFileSync('eslint.config.mjs','import js from \"@eslint/js\";\nimport tseslint from \"typescript-eslint\";\nexport default [\n  js.configs.recommended,\n  ...tseslint.configs.recommended,\n  { files: [\"src/**/*.{ts,tsx}\"], languageOptions: { parserOptions: { ecmaFeatures: { jsx: true } } } },\n  { ignores: [\"dist/**\", \"node_modules/**\"] }\n];\n',{encoding:'utf8'});"
    displayName: Generate ESLint flat config

  - script: npx eslint "src/**/*.{ts,tsx}" --max-warnings=0
    displayName: Lint TS/TSX

  - script: node -e "var fs=require('fs');fs.writeFileSync('.stylelintrc.json',JSON.stringify({extends:['stylelint-config-standard'],rules:{'color-no-invalid-hex':true}},null,2),{encoding:'utf8'});"
    displayName: Generate Stylelint config

  - script: npx --no stylelint "src/**/*.css"
    displayName: Lint CSS

  - script: npm run build
    displayName: Build

  - powershell: |
      New-Item -ItemType Directory -Path "$(Build.ArtifactStagingDirectory)\site" -Force | Out-Null
      Copy-Item -Path "dist\*" -Destination "$(Build.ArtifactStagingDirectory)\site" -Recurse
      Compress-Archive -Path "$(Build.ArtifactStagingDirectory)\site\*" -DestinationPath "$(Build.ArtifactStagingDirectory)\oneluckidev-site-$(Build.BuildNumber).zip" -Force
    displayName: Package for IIS (ZIP)

  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: '$(Build.ArtifactStagingDirectory)'
      artifactName: 'drop'
    displayName: Publish artifact