name: $(Date:yy).$(DayOfYear)
trigger:
  branches:
    include:
      - main

pool:
  vmImage: windows-latest

steps:
  - checkout: self

  - powershell: |
      $now = Get-Date
      $secondsOfDay = [int][Math]::Floor($now.TimeOfDay.TotalSeconds)
      $buildNumber = '{0}.{1}.{2}' -f $now.ToString('yy'), $now.DayOfYear, $secondsOfDay
      Write-Host "##vso[build.updatebuildnumber]$buildNumber"
    displayName: Set build number (YY.DayOfYear.SecondsSinceDayStart)

  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'

  - script: npm ci
    displayName: Install dependencies

  - script: npm install --no-save eslint@9 @typescript-eslint/parser @typescript-eslint/eslint-plugin stylelint stylelint-config-standard
    displayName: Install lint tooling

  - powershell: |
      @'
      // Flat config for ESLint v9+
      import tseslint from "@typescript-eslint/eslint-plugin";
      import tsParser from "@typescript-eslint/parser";

      export default [
        {
          files: ["src/**/*.{ts,tsx}"],
          languageOptions: {
            parser: tsParser,
            parserOptions: {
              ecmaVersion: "latest",
              sourceType: "module",
              project: "./tsconfig.json"
            }
          },
          plugins: { "@typescript-eslint": tseslint },
          rules: {
            "no-unused-vars": "off",
            "@typescript-eslint/no-unused-vars": ["error", { "argsIgnorePattern": "^_", "varsIgnorePattern": "^_" }]
          }
        }
      ];
      '@ | Set-Content -Path eslint.config.mjs -Encoding UTF8
    displayName: Create ESLint flat config

  - script: npx eslint "src/**/*.{ts,tsx}" --max-warnings=0
    displayName: Lint TS/TSX



  - script: npm run build
    displayName: Build

  - powershell: |
      $siteDir = "$(Build.ArtifactStagingDirectory)\site"
      $zipPath = "$(Build.ArtifactStagingDirectory)\oneluckidev-site-$(Build.BuildNumber).zip"
      $universalDir = "$(Build.ArtifactStagingDirectory)\universal"

      New-Item -ItemType Directory -Path $siteDir -Force | Out-Null
      Copy-Item -Path "dist\*" -Destination $siteDir -Recurse

      Compress-Archive -Path "$siteDir\*" -DestinationPath $zipPath -Force

      New-Item -ItemType Directory -Path $universalDir -Force | Out-Null
      Copy-Item -Path $zipPath -Destination $universalDir -Force
    displayName: Package for IIS (ZIP)
  - task: UniversalPackages@0
    inputs:
      command: 'publish'
      publishDirectory: '$(Build.ArtifactStagingDirectory)'
      feedsToUsePublish: 'internal'
      vstsFeedPublish: '5fd157e4-52eb-4fe6-b1bb-03f13ea2592b/2ec6e481-5da1-43a4-bb57-007335ef852f'
      vstsFeedPackagePublish: 'oneluckidev-site'
      versionOption: 'custom'
      versionPublish: '$(Build.BuildNumber)'
      packagePublishDescription: 'The oneluckidev site'  
    displayName: Publish to Azure Artifacts (Universal)
    
  - task: rvo-vsts-promotepackage-task@3
    inputs:
      feed: '5fd157e4-52eb-4fe6-b1bb-03f13ea2592b/2ec6e481-5da1-43a4-bb57-007335ef852f'
      inputType: 'nameVersion'
      definition: 'oneluckidev-site'
      version: '$(Build.BuildNumber)'
      releaseView: 'ed74eee9-aff6-46cb-82a9-66d9ed03896f'